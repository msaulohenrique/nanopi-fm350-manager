name: Build FriendlyWrt candidate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: FriendlyWrt version, for example 25.12; empty means latest
        required: false
        type: string
      force_release:
        description: Build even when this firmware identity already has a candidate
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'config/**'
      - 'overlay/**'
      - 'scripts/**'
      - 'targets/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: friendlywrt-candidate
  # A newer source/recipe state makes an older in-flight candidate stale.
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      tag: ${{ steps.decision.outputs.tag }}
      version: ${{ steps.discover.outputs.version }}
      fingerprint: ${{ steps.discover.outputs.fingerprint }}
      provenance_fingerprint: ${{ steps.discover.outputs.provenance_fingerprint }}
      lock_b64: ${{ steps.discover.outputs.lock_b64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve effective firmware inputs and build provenance
        id: discover
        env:
          FRIENDLYWRT_VERSION_OVERRIDE: ${{ inputs.version }}
        run: ./scripts/discover-upstream.sh source-lock.json

      - name: Decide whether a candidate build is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ steps.discover.outputs.tag }}
          FIRMWARE_FINGERPRINT: ${{ steps.discover.outputs.fingerprint }}
          PROVENANCE_FINGERPRINT: ${{ steps.discover.outputs.provenance_fingerprint }}
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
        run: |
          tag="candidate-${BASE_TAG}"
          should_build=true
          reason='effective firmware inputs changed or no candidate exists'
          if release_json=$(gh release view "$tag" --json isDraft 2>/dev/null); then
            is_draft=$(printf '%s' "$release_json" | jq -r .isDraft)
            if [[ "$is_draft" != "true" && "$FORCE_RELEASE" != "true" ]]; then
              should_build=false
              reason='same firmware identity already published; provenance-only changes are ignored'
            elif [[ "$is_draft" != "true" ]]; then
              tag="${tag}-r${GITHUB_RUN_NUMBER}"
              reason='manual force_release requested'
            fi
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "should_build=$should_build" >>"$GITHUB_OUTPUT"
          echo "### Candidate decision" >>"$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$tag\`" >>"$GITHUB_STEP_SUMMARY"
          echo "- Build: \`$should_build\`" >>"$GITHUB_STEP_SUMMARY"
          echo "- Reason: $reason" >>"$GITHUB_STEP_SUMMARY"
          echo "- Firmware fingerprint: \`$FIRMWARE_FINGERPRINT\`" >>"$GITHUB_STEP_SUMMARY"
          echo "- Provenance fingerprint: \`$PROVENANCE_FINGERPRINT\`" >>"$GITHUB_STEP_SUMMARY"
          echo "- Hardware verified: \`false\`" >>"$GITHUB_STEP_SUMMARY"

  rootfs:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      rootfs_filename: ${{ steps.build.outputs.rootfs_filename }}
      host_pm_filename: ${{ steps.build.outputs.host_pm_filename }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore exact source lock
        env:
          LOCK_B64: ${{ needs.prepare.outputs.lock_b64 }}
        run: printf '%s' "$LOCK_B64" | base64 -d >source-lock.json

      - name: Free runner disk
        run: ./scripts/prepare-runner.sh

      - name: Install build dependencies
        run: ./scripts/install-build-env.sh source-lock.json

      - name: Configure build Git identity
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify disk after dependency installation
        run: ./scripts/prepare-runner.sh

      - name: Install pinned repo tool
        run: |
          ./scripts/install-repo-tool.sh source-lock.json
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Synchronize rootfs sources
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/sync-sources.sh source-lock.json work rootfs

      - name: Compile FriendlyWrt rootfs
        id: build
        run: ./scripts/build-rootfs.sh source-lock.json work artifacts

      - name: Create draft candidate and upload intermediate files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease \
              --title "Candidate · FriendlyWrt $VERSION · NanoPi NEO3 Plus + FM350-GL" \
              --notes "Automated candidate build in progress. It is not hardware-verified and must not be treated as stable until promoted by the hardware-validation workflow."
          fi
          gh release upload "$RELEASE_TAG" \
            "artifacts/${{ steps.build.outputs.rootfs_filename }}" \
            "artifacts/${{ steps.build.outputs.host_pm_filename }}" \
            source-lock.json --clobber

  image:
    needs: [prepare, rootfs]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore exact source lock
        env:
          LOCK_B64: ${{ needs.prepare.outputs.lock_b64 }}
        run: printf '%s' "$LOCK_B64" | base64 -d >source-lock.json

      - name: Free runner disk
        run: ./scripts/prepare-runner.sh

      - name: Install build dependencies
        run: ./scripts/install-build-env.sh source-lock.json

      - name: Configure build Git identity
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify disk after dependency installation
        run: ./scripts/prepare-runner.sh

      - name: Install pinned repo tool
        run: |
          ./scripts/install-repo-tool.sh source-lock.json
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Synchronize image sources
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/sync-sources.sh source-lock.json work image

      - name: Download intermediate rootfs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p intermediate
          gh release download "$RELEASE_TAG" \
            --pattern '${{ needs.rootfs.outputs.rootfs_filename }}' --dir intermediate
          gh release download "$RELEASE_TAG" \
            --pattern '${{ needs.rootfs.outputs.host_pm_filename }}' --dir intermediate

      - name: Build and structurally validate SD image
        id: image
        run: |
          # Public candidates intentionally do not inject a shared root password
          # or personal SSH keys. First boot uses the secure onboarding flow.
          ./scripts/build-image.sh source-lock.json work \
            "intermediate/${{ needs.rootfs.outputs.rootfs_filename }}" \
            "intermediate/${{ needs.rootfs.outputs.host_pm_filename }}" artifacts

      - name: Generate multilingual candidate notes
        run: |
          ./scripts/generate-release-notes.py source-lock.json \
            --image '${{ steps.image.outputs.image_filename }}' \
            --output artifacts/release-notes.md
          cat >>artifacts/release-notes.md <<'EOF'

          ---

          ## Candidate status / Estado da imagem

          This is an **automated hardware-unverified candidate**. Compilation, source locking, checksums, gzip integrity and SD-image structural checks passed, but those checks do not prove that the image boots on a physical NanoPi NEO3 Plus. Stable releases are created only by the separate hardware-validation workflow after real-device boot, Ethernet, FM350 and Internet tests.

          Esta é uma **imagem candidata automática ainda não validada em hardware**. Compilação, fontes fixadas, checksums, integridade gzip e validações estruturais da imagem passaram, mas isso não prova boot em um NanoPi NEO3 Plus físico. Releases estáveis só são publicadas pelo workflow separado de validação em hardware após testes reais de boot, Ethernet, FM350 e Internet.
          EOF

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          gh release upload "$RELEASE_TAG" \
            "artifacts/${{ steps.image.outputs.image_filename }}" \
            artifacts/SHA256SUMS artifacts/RAW_IMAGE_SHA256 \
            artifacts/source-lock.json --clobber
          gh release delete-asset "$RELEASE_TAG" \
            '${{ needs.rootfs.outputs.rootfs_filename }}' --yes
          gh release delete-asset "$RELEASE_TAG" \
            '${{ needs.rootfs.outputs.host_pm_filename }}' --yes
          gh release edit "$RELEASE_TAG" \
            --title "Candidate · FriendlyWrt $VERSION · NanoPi NEO3 Plus + FM350-GL" \
            --notes-file artifacts/release-notes.md --draft=false --prerelease

      - name: Verify published assets by downloading them again
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          gzip -t "published/${{ steps.image.outputs.image_filename }}"
          echo "### Published candidate" >>"$GITHUB_STEP_SUMMARY"
          echo "[$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)" >>"$GITHUB_STEP_SUMMARY"
          echo "Hardware verification is still required before stable promotion." >>"$GITHUB_STEP_SUMMARY"

      - name: Close resolved automated-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          failure_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Automated FriendlyWrt candidate failed" in:title' \
            --json number,title \
            --jq '[.[] | select(.title == "Automated FriendlyWrt candidate failed")][0].number // empty')
          if [[ -n "$failure_issue" ]]; then
            gh issue close "$failure_issue" --repo "$GITHUB_REPOSITORY" \
              --comment "Resolved by candidate $RELEASE_TAG. Hardware verification is tracked separately."
          fi

  cleanup-on-failure:
    needs: [prepare, rootfs, image]
    if: >-
      ${{ always() && needs.prepare.outputs.should_build == 'true' &&
          (needs.rootfs.result == 'failure' || needs.image.result == 'failure') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Remove incomplete draft and report failure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if release_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_draft" == true ]]; then
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes
            fi
          fi
          title='Automated FriendlyWrt candidate failed'
          body="Workflow failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Automated FriendlyWrt candidate failed" in:title' \
            --json number,title \
            --jq '[.[] | select(.title == "Automated FriendlyWrt candidate failed")][0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body" --label bug || \
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body "$body"
          fi

name: Cleanup legacy releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-legacy-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Remove pre-policy releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          legacy_tags=(
            friendlywrt-25.12-00c8dea9afeb
            friendlywrt-25.12-0d59ca68ecb0
            friendlywrt-25.12-245bfd723eea
            friendlywrt-25.12-326f13781cb0
            friendlywrt-25.12-b33f44cbbb72
            friendlywrt-25.12-b37a164896ae
            friendlywrt-25.12-b794b6a1cdd1
            friendlywrt-25.12-ba32f08b5120
            friendlywrt-25.12-c808c9c34ce2
          )

          for tag in "${legacy_tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Deleting legacy release: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Deleting legacy tag: $tag"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done

      - name: Verify cleanup boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          legacy_tags=(
            friendlywrt-25.12-00c8dea9afeb
            friendlywrt-25.12-0d59ca68ecb0
            friendlywrt-25.12-245bfd723eea
            friendlywrt-25.12-326f13781cb0
            friendlywrt-25.12-b33f44cbbb72
            friendlywrt-25.12-b37a164896ae
            friendlywrt-25.12-b794b6a1cdd1
            friendlywrt-25.12-ba32f08b5120
            friendlywrt-25.12-c808c9c34ce2
          )

          for tag in "${legacy_tags[@]}"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Legacy tag still exists: $tag" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Legacy release still exists: $tag" >&2
              exit 1
            fi
          done

          echo 'Legacy release/tag cleanup completed.'
          echo 'Candidate and future hardware-verified tags are outside the explicit deletion list and are untouched.'
